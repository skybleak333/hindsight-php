<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="400" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<text x="40" y="44" font-size="15" font-weight="600" fill="#52514e">YOUR LARAVEL APP</text>
<rect x="40" y="64" width="430" height="72" rx="10" fill="#f3f2ef" stroke="#c9c8c3"/>
<text x="60" y="94" font-size="18" font-weight="600" fill="#0b0b0b">User message</text>
<text x="60" y="119" font-size="15" fill="#52514e">“When does my plan renew?”</text>
<rect x="40" y="160" width="430" height="72" rx="10" fill="#f3f2ef" stroke="#c9c8c3"/>
<text x="60" y="190" font-size="18" font-weight="600" fill="#0b0b0b">Agent instructions</text>
<text x="60" y="215" font-size="15" fill="#52514e">+ # Relevant Memories: Pro plan, short answers</text>
<rect x="40" y="256" width="430" height="72" rx="10" fill="#f3f2ef" stroke="#c9c8c3"/>
<text x="60" y="286" font-size="18" font-weight="600" fill="#0b0b0b">Model answers</text>
<text x="60" y="311" font-size="15" fill="#52514e">any Laravel AI SDK provider</text>
<line x1="255" y1="136" x2="255" y2="158" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="255" y1="232" x2="255" y2="254" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="44" font-size="15" font-weight="600" fill="#52514e">HINDSIGHT SERVER</text>
<rect x="640" y="64" width="280" height="264" rx="10" fill="#eaf2fc" stroke="#2a78d6"/>
<text x="664" y="100" font-size="18" font-weight="600" fill="#0b0b0b">Memory bank</text>
<text x="664" y="126" font-size="15" fill="#52514e">user-42</text>
<text x="664" y="170" font-size="15" fill="#52514e">facts, entities, dates</text>
<text x="664" y="194" font-size="15" fill="#52514e">extracted from what</text>
<text x="664" y="218" font-size="15" fill="#52514e">earlier conversations</text>
<text x="664" y="242" font-size="15" fill="#52514e">stored</text>
<path d="M470,100 L638,100" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="484" y="90" font-size="14" font-weight="600" fill="#2a78d6">1  recall</text>
<path d="M638,196 L472,196" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="484" y="186" font-size="14" font-weight="600" fill="#2a78d6">2  relevant memories</text>
<path d="M470,292 L638,292" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="484" y="282" font-size="14" font-weight="600" fill="#2a78d6">3  retain the exchange</text>
<text x="484" y="314" font-size="13" fill="#52514e">now, or from a queued job</text>
<text x="40" y="372" font-size="15" fill="#52514e">Memory::bank("user-{$id}") does steps 1–3 on every run. Add -&gt;queue() and step 3 retries through your queue.</text>
</svg>