<text x="60" y="94" font-size="18" font-weight="600" fill="#f0f6fc">User message</text>
<text x="60" y="119" font-size="15" fill="#9198a1">“When does my plan renew?”</text>
<rect x="40" y="160" width="430" height="72" rx="10" fill="#1c2128" stroke="#3d444d"/>
<text x="60" y="190" font-size="18" font-weight="600" fill="#f0f6fc">Agent instructions</text>
<text x="60" y="215" font-size="15" fill="#9198a1">+ # Relevant Memories: Pro plan, short answers</text>
<rect x="40" y="256" width="430" height="72" rx="10" fill="#1c2128" stroke="#3d444d"/>
<text x="60" y="286" font-size="18" font-weight="600" fill="#f0f6fc">Model answers</text>
<text x="60" y="311" font-size="15" fill="#9198a1">any Laravel AI SDK provider</text>
<line x1="255" y1="136" x2="255" y2="158" stroke="#4493f8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="255" y1="232" x2="255" y2="254" stroke="#4493f8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="44" font-size="15" font-weight="600" fill="#9198a1">HINDSIGHT SERVER</text>
<rect x="640" y="64" width="280" height="264" rx="10" fill="#132339" stroke="#4493f8"/>
<text x="664" y="100" font-size="18" font-weight="600" fill="#f0f6fc">Memory bank</text>
<text x="664" y="126" font-size="15" fill="#9198a1">user-42</text>
<text x="664" y="170" font-size="15" fill="#9198a1">facts, entities, dates</text>
<text x="664" y="194" font-size="15" fill="#9198a1">extracted from what</text>
<text x="664" y="218" font-size="15" fill="#9198a1">earlier conversations</text>
<text x="664" y="242" font-size="15" fill="#9198a1">stored</text>
<path d="M470,100 L638,100" stroke="#4493f8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="484" y="90" font-size="14" font-weight="600" fill="#4493f8">1  recall</text>
<path d="M638,196 L472,196" stroke="#4493f8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="484" y="186" font-size="14" font-weight="600" fill="#4493f8">2  relevant memories</text>
<path d="M470,292 L638,292" stroke="#4493f8" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="484" y="282" font-size="14" font-weight="600" fill="#4493f8">3  retain the exchange</text>
<text x="484" y="314" font-size="13" fill="#9198a1">now, or from a queued job</text>
<text x="40" y="372" font-size="15" fill="#9198a1">Memory::bank("user-{$id}") does steps 1–3 on every run. Add -&gt;queue() and step 3 retries through your queue.</text>
